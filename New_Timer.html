<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Activity Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            padding: 40px;
            position: relative;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .current-timer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .current-timer::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .current-timer h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        
        .time-display {
            font-size: 5em;
            font-weight: 800;
            margin: 30px 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
            letter-spacing: 5px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        
        button {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .btn-start {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-start:hover {
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-pause {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        
        .btn-pause:hover {
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn-stop:hover {
            box-shadow: 0 6px 25px rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-skip {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
        }
        
        .btn-skip:hover {
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        
        .timer-list {
            margin-bottom: 30px;
        }
        
        .timer-list h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .timer-list h3::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .timer-item {
            background: #f8fafc;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .timer-item:hover {
            background: #f1f5f9;
            transform: translateX(5px);
        }
        
        .timer-item.active {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            border: 2px solid #3b82f6;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 4px 25px rgba(59, 130, 246, 0.4); }
        }
        
        .timer-item.completed {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            opacity: 0.8;
            border: 2px solid #10b981;
        }
        
        .timer-item input {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95em;
            transition: all 0.3s ease;
            background: white;
        }
        
        .timer-item input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .timer-item input[type="text"] {
            flex: 1;
            font-weight: 500;
        }
        
        .timer-item input[type="number"] {
            width: 80px;
            font-weight: 600;
        }
        
        .timer-item input[type="range"] {
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .timer-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .timer-item label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #475569;
        }
        
        .btn-remove {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 10px 18px;
            font-size: 0.9em;
        }
        
        .btn-remove:hover {
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        
        .btn-add {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            font-size: 1.05em;
            font-weight: 600;
        }
        
        .btn-add:hover {
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s ease;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        
        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 0.95em;
            opacity: 0.95;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
        
        #volumeDisplay {
            font-weight: 600;
            color: #667eea;
            min-width: 40px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Daily Activity Timer</h1>
        
        <div class="current-timer">
            <h2 id="currentActivity">Ready to Start</h2>
            <div class="time-display" id="timeDisplay">00:00</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
            <div class="status" id="status">Configure your timers below and click Start</div>
            <div class="controls">
                <button class="btn-start" id="startBtn" onclick="startTimers()">Start</button>
                <button class="btn-pause" id="pauseBtn" onclick="togglePause()" style="display:none">Pause</button>
                <button class="btn-skip" id="skipBtn" onclick="skipTimer()" style="display:none">Skip</button>
                <button class="btn-stop" id="stopBtn" onclick="stopTimers()" style="display:none">Stop</button>
            </div>
        </div>
        
        <div class="timer-list">
            <h3>Display Settings</h3>
            <div class="timer-item" style="margin-bottom: 20px;">
                <label style="flex: 1; cursor: pointer;">
                    <input type="checkbox" id="showSeconds" checked onchange="updateDisplay()" style="width: auto; margin-right: 10px;">
                    Show seconds in timer display
                </label>
            </div>
            
            <h3>Alarm Settings</h3>
            <div class="timer-item" style="margin-bottom: 20px;">
                <label style="flex: 1;">
                    Number of Beeps:
                    <input type="number" id="beepCount" value="3" min="1" max="10" onchange="updateAlarmSettings()" style="width: 70px; margin-left: 10px;">
                </label>
                <label style="flex: 1;">
                    Beep Length (sec):
                    <input type="number" id="beepDuration" value="0.15" min="0.05" max="1" step="0.05" onchange="updateAlarmSettings()" style="width: 70px; margin-left: 10px;">
                </label>
            </div>
            <div class="timer-item" style="margin-bottom: 20px;">
                <label style="flex: 1;">
                    Volume:
                    <input type="range" id="alarmVolume" value="30" min="0" max="100" onchange="updateAlarmSettings()" style="width: 120px; margin-left: 10px;">
                    <span id="volumeDisplay">30%</span>
                </label>
                <button class="btn-start" onclick="testAlarm()" style="padding: 8px 20px;">Test Sound</button>
            </div>
            
            <h3>Your Daily Schedule</h3>
            <div id="timerList"></div>
            <button class="btn-add" onclick="addTimer()">+ Add Timer</button>
        </div>
    </div>
    
    <script>
        let timers = [
            { name: 'Work', duration: 25 },
            { name: 'Email', duration: 10 },
            { name: 'Learning', duration: 30 },
            { name: 'Break', duration: 5 },
            { name: 'Lunch', duration: 30 }
        ];
        
        let currentIndex = -1;
        let timeRemaining = 0;
        let totalTime = 0;
        let isRunning = false;
        let isPaused = false;
        let intervalId = null;
        let beepCount = 3;
        let beepDuration = 0.15;
        let alarmVolume = 0.3;
        
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function updateAlarmSettings() {
            beepCount = parseInt(document.getElementById('beepCount').value);
            beepDuration = parseFloat(document.getElementById('beepDuration').value);
            alarmVolume = parseInt(document.getElementById('alarmVolume').value) / 100;
            document.getElementById('volumeDisplay').textContent = Math.round(alarmVolume * 100) + '%';
        }
        
        function testAlarm() {
            playAlarm();
        }
        
        function playAlarm() {
            const beepGap = 0.1; // Gap between beeps
            
            for (let i = 0; i < beepCount; i++) {
                const startTime = audioContext.currentTime + (i * (beepDuration + beepGap));
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(alarmVolume, startTime + 0.01);
                gainNode.gain.setValueAtTime(alarmVolume, startTime + beepDuration - 0.02);
                gainNode.gain.linearRampToValueAtTime(0, startTime + beepDuration);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + beepDuration);
            }
        }
        
        function renderTimers() {
            const list = document.getElementById('timerList');
            list.innerHTML = '';
            
            timers.forEach((timer, index) => {
                const div = document.createElement('div');
                div.className = 'timer-item';
                if (index === currentIndex) div.classList.add('active');
                if (index < currentIndex) div.classList.add('completed');
                
                div.innerHTML = `
                    <input type="text" value="${timer.name}" onchange="updateTimer(${index}, 'name', this.value)" placeholder="Activity name">
                    <input type="number" value="${timer.duration}" onchange="updateTimer(${index}, 'duration', this.value)" min="1" max="999">
                    <span>min</span>
                    <button class="btn-remove" onclick="removeTimer(${index})">Remove</button>
                `;
                
                list.appendChild(div);
            });
        }
        
        function addTimer() {
            timers.push({ name: 'New Activity', duration: 15 });
            renderTimers();
        }
        
        function removeTimer(index) {
            if (isRunning && index === currentIndex) {
                alert('Cannot remove the currently active timer');
                return;
            }
            timers.splice(index, 1);
            if (currentIndex > index) currentIndex--;
            renderTimers();
        }
        
        function updateTimer(index, field, value) {
            if (field === 'duration') {
                timers[index][field] = Math.max(1, parseInt(value) || 1);
            } else {
                timers[index][field] = value;
            }
        }
        
        function startTimers() {
            if (timers.length === 0) {
                alert('Please add at least one timer');
                return;
            }
            
            isRunning = true;
            isPaused = false;
            currentIndex = 0;
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'inline-block';
            document.getElementById('skipBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'inline-block';
            
            startCurrentTimer();
        }
        
        function startCurrentTimer() {
            if (currentIndex >= timers.length) {
                completeAll();
                return;
            }
            
            const timer = timers[currentIndex];
            timeRemaining = timer.duration * 60;
            totalTime = timer.duration * 60;
            
            document.getElementById('currentActivity').textContent = timer.name;
            document.getElementById('status').textContent = `Timer ${currentIndex + 1} of ${timers.length}`;
            
            renderTimers();
            updateDisplay();
            
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(tick, 1000);
        }
        
        function tick() {
            if (isPaused) return;
            
            timeRemaining--;
            updateDisplay();
            
            if (timeRemaining <= 0) {
                clearInterval(intervalId);
                playAlarm();
                currentIndex++;
                
                setTimeout(() => {
                    if (currentIndex < timers.length) {
                        startCurrentTimer();
                    } else {
                        completeAll();
                    }
                }, 1000);
            }
        }
        
        function updateDisplay() {
            const showSeconds = document.getElementById('showSeconds').checked;
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            
            if (showSeconds) {
                document.getElementById('timeDisplay').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                document.getElementById('timeDisplay').textContent = 
                    `${String(minutes).padStart(2, '0')} min`;
            }
            
            const progress = ((totalTime - timeRemaining) / totalTime) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }
        
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? 'Resume' : 'Pause';
            document.getElementById('status').textContent = isPaused ? 'Paused' : `Timer ${currentIndex + 1} of ${timers.length}`;
        }
        
        function skipTimer() {
            clearInterval(intervalId);
            currentIndex++;
            if (currentIndex < timers.length) {
                startCurrentTimer();
            } else {
                completeAll();
            }
        }
        
        function stopTimers() {
            clearInterval(intervalId);
            isRunning = false;
            isPaused = false;
            currentIndex = -1;
            
            const showSeconds = document.getElementById('showSeconds').checked;
            document.getElementById('currentActivity').textContent = 'Stopped';
            document.getElementById('timeDisplay').textContent = showSeconds ? '00:00' : '00 min';
            document.getElementById('status').textContent = 'Click Start to begin again';
            document.getElementById('progressBar').style.width = '0%';
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
            
            renderTimers();
        }
        
        function completeAll() {
            clearInterval(intervalId);
            isRunning = false;
            
            const showSeconds = document.getElementById('showSeconds').checked;
            document.getElementById('currentActivity').textContent = 'All Complete! 🎉';
            document.getElementById('timeDisplay').textContent = showSeconds ? '00:00' : '00 min';
            document.getElementById('status').textContent = 'Great job finishing your schedule!';
            document.getElementById('progressBar').style.width = '100%';
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
            
            currentIndex = -1;
            renderTimers();
        }
        
        renderTimers();
    </script>
</body>
</html>
